<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sedeam Wrapped</title>
  <link rel="icon" href="icons/icon32.png">
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="ui.css">
  <style>
    html, body { height: 100%; }
    body { background: #05080c; overflow: hidden; color: #fff; }
    .stage { position: fixed; inset: 0; display: grid; place-items: center; }
    .story {
      position: relative; width: min(440px, 100vw); height: min(780px, 100vh); border-radius: 18px; overflow: hidden; isolation: isolate;
      background: radial-gradient(120% 70% at 80% 0%, color-mix(in srgb, var(--c1, #2a78d6) 85%, #fff 5%) 0%, transparent 60%),
        radial-gradient(90% 60% at 0% 100%, color-mix(in srgb, var(--c2, #6250d6) 80%, transparent) 0%, transparent 70%),
        #0a0f15;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
      transition: background .6s;
    }
    @media (max-width: 480px) { .story { border-radius: 0; } }
    .story::before { content: ''; position: absolute; inset: 0; z-index: -1; background: repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 2px, transparent 2px 12px); }
    .bars { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 4px; z-index: 5; }
    .bars span { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; }
    .bars span i { display: block; height: 100%; width: 0; background: #fff; }
    .bars span.done i { width: 100%; }
    .head { position: absolute; top: 24px; left: 16px; right: 16px; display: flex; align-items: center; justify-content: space-between; z-index: 5; font-size: 11px; letter-spacing: .2em; font-weight: 800; color: rgba(255,255,255,.75); }
    .head button { background: rgba(0,0,0,.25); border: 0; color: #fff; padding: 4px 10px; font-size: 13px; border-radius: 999px; }
    .slide { position: absolute; inset: 0; padding: 72px 28px 40px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
    .slide[hidden] { display: none; }
    .k { font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.7); }
    .huge { font-size: 76px; font-weight: 900; line-height: .95; letter-spacing: -.02em; }
    .big { font-size: 34px; font-weight: 900; line-height: 1.05; }
    .med { font-size: 20px; font-weight: 700; line-height: 1.25; }
    .soft { color: rgba(255,255,255,.75); font-size: 15px; line-height: 1.45; }
    .emoji-xl { font-size: 96px; line-height: 1; filter: drop-shadow(0 12px 24px rgba(0,0,0,.4)); }
    .pill { display: inline-flex; align-self: flex-start; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.14); font-weight: 700; font-size: 13px; }
    .pill.up { background: rgba(139, 212, 91, .22); }
    .pill.down { background: rgba(230, 103, 103, .25); }
    .rank { display: grid; gap: 10px; margin-top: 6px; }
    .rank .row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; }
    .rank .n { font-size: 22px; font-weight: 900; color: rgba(255,255,255,.5); text-align: center; }
    .rank .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 5px; }
    .rank .bar i { display: block; height: 100%; border-radius: 4px; }
    .rank .v { font-weight: 800; font-variant-numeric: tabular-nums; }
    .hours-viz { display: flex; align-items: flex-end; gap: 3px; height: 110px; margin-top: 8px; }
    .hours-viz i { flex: 1; border-radius: 3px 3px 0 0; background: rgba(255,255,255,.35); min-height: 2px; }
    .hours-viz i.peak { background: #fff; }
    .hours-axis { display: flex; justify-content: space-between; font-size: 10px; color: rgba(255,255,255,.55); }
    .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
    .stats3 div { background: rgba(0,0,0,.25); border-radius: 10px; padding: 10px; }
    .stats3 b { display: block; font-size: 20px; }
    .stats3 span { font-size: 11px; color: rgba(255,255,255,.7); }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .badges span { display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.28); font-size: 13px; box-shadow: inset 0 0 0 1px rgba(232,182,76,.45); }
    .final img { width: 100%; border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
    .final .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .final .acts button, .final .acts select { position: relative; z-index: 6; }
    .final .acts button { background: rgba(255,255,255,.14); color: #fff; border: 0; }
    .final .acts button.primary { background: #fff; color: #0a0f15; }
    .final .msg { text-align: center; font-size: 12px; color: rgba(255,255,255,.75); min-height: 16px; }
    .tap { position: absolute; top: 60px; bottom: 0; width: 34%; z-index: 4; cursor: pointer; }
    .tap.l { left: 0; } .tap.r { right: 0; width: 66%; }
    .final-open .tap { display: none; }
    .reveal > * { animation: rise .6s cubic-bezier(.2,.9,.25,1.1) both; }
    .reveal > *:nth-child(2) { animation-delay: .12s; } .reveal > *:nth-child(3) { animation-delay: .24s; }
    .reveal > *:nth-child(4) { animation-delay: .36s; } .reveal > *:nth-child(5) { animation-delay: .48s; } .reveal > *:nth-child(6) { animation-delay: .6s; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
    @media (prefers-reduced-motion: reduce) { .reveal > * { animation: none; } }
    /* ---------- Modo anual ---------- */
    body.year .story { background: var(--c1); color: var(--ink); transition: background .7s ease, color .4s; }
    body.year .story::before { background: radial-gradient(rgba(0,0,0,.09) 1px, transparent 1.2px) 0 0 / 5px 5px; }
    body.year .head { color: color-mix(in srgb, var(--ink) 70%, transparent); }
    body.year .head button { background: color-mix(in srgb, var(--ink) 16%, transparent); color: var(--ink); }
    body.year .bars span { background: color-mix(in srgb, var(--ink) 25%, transparent); }
    body.year .bars span i { background: var(--ink); }
    body.year .k { color: color-mix(in srgb, var(--ink) 75%, transparent); }
    body.year .soft { color: color-mix(in srgb, var(--ink) 82%, transparent); }
    body.year .pill { background: color-mix(in srgb, var(--ink) 14%, transparent); }
    body.year .stats3 div { background: color-mix(in srgb, var(--ink) 10%, transparent); }
    body.year .stats3 span { color: color-mix(in srgb, var(--ink) 70%, transparent); }
    body.year .slide { z-index: 1; }

    .shapes { display: none; position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    body.year .shapes { display: block; }
    .shapes i { position: absolute; border-radius: 50%; background: var(--c2); opacity: .55; transition: background .7s; animation: float 14s ease-in-out infinite alternate; }
    .shapes i:nth-child(1) { width: 340px; height: 340px; top: -120px; right: -110px; }
    .shapes i:nth-child(2) { width: 220px; height: 220px; bottom: -70px; left: -60px; animation-duration: 11s; animation-direction: alternate-reverse; }
    .shapes i:nth-child(3) { width: 90px; height: 90px; bottom: 140px; right: 30px; opacity: .8; animation-duration: 8s; }
    .shapes b { position: absolute; width: 420px; height: 420px; left: -150px; top: 30%; border-radius: 50%; border: 3px dashed color-mix(in srgb, var(--ink) 18%, transparent); animation: spin 40s linear infinite; }
    @keyframes float { to { transform: translate(-30px, 40px) scale(1.12); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    .mega { font-size: 104px; font-weight: 900; letter-spacing: -.045em; line-height: .9; font-variant-numeric: tabular-nums; }
    .year-digits { display: flex; font-size: 150px; font-weight: 900; letter-spacing: -.07em; line-height: .82; }
    .year-digits span { display: inline-block; animation: drop .7s cubic-bezier(.2,1.3,.4,1) both; }
    @keyframes drop { from { opacity: 0; transform: translateY(-70px) rotate(-10deg); } }

    .top5 { display: grid; gap: 10px; }
    .top5 .row { display: grid; grid-template-columns: 34px 46px 1fr; gap: 12px; align-items: center; animation: pop .5s cubic-bezier(.2,1.2,.4,1) both; }
    .top5 .n { font-size: 34px; font-weight: 900; opacity: .55; text-align: center; }
    .top5 b { display: block; font-size: 17px; }
    .top5 span { font-size: 12.5px; opacity: .8; }
    @keyframes pop { from { opacity: 0; transform: translateX(40px) scale(.9); } }

    .cap-reveal { align-self: center; animation: spinIn 1s cubic-bezier(.2,1.1,.3,1) both; }
    @keyframes spinIn { from { opacity: 0; transform: rotate(-200deg) scale(.2); } to { transform: rotate(-5deg); } }

    .months { display: flex; align-items: flex-end; gap: 6px; height: 170px; }
    .months .m { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
    .months i { width: 100%; height: var(--h); border-radius: 5px 5px 0 0; background: color-mix(in srgb, var(--ink) 30%, transparent); animation: grow .8s cubic-bezier(.2,1,.3,1) both; }
    .months .m.top i { background: var(--ink); }
    .months span { font-size: 11px; font-weight: 800; opacity: .75; }
    @keyframes grow { from { height: 0; } }

    .seasons4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .seasons4 > div { border-radius: 14px; padding: 14px; background: color-mix(in srgb, var(--sc) 70%, #000); display: grid; gap: 2px; animation: pop .5s cubic-bezier(.2,1.2,.4,1) both; position: relative; }
    .seasons4 .e { font-size: 30px; }
    .seasons4 b { font-size: 22px; font-weight: 900; }
    .seasons4 .t { font-size: 12px; opacity: .85; }
    .seasons4 .md { position: absolute; right: 12px; top: 10px; font-size: 26px; }

    .journey { display: grid; gap: 6px; }
    .journey .from, .journey .to { border-radius: 14px; padding: 14px 16px; }
    .journey .from { background: color-mix(in srgb, var(--ink) 10%, transparent); opacity: .85; }
    .journey .to { background: color-mix(in srgb, var(--ink) 92%, transparent); color: var(--c1); animation: pop .6s .5s cubic-bezier(.2,1.2,.4,1) both; }
    .journey span { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
    .journey b { display: block; font-size: 26px; font-weight: 900; }
    .journey .arrow { font-size: 40px; text-align: center; line-height: 1; }

    .aura { width: 230px; height: 230px; align-self: center; border-radius: 50%; display: grid; place-items: center; position: relative; }
    .aura::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--a1), var(--a2), var(--a1)); filter: blur(28px); animation: spin 6s linear infinite; }
    .aura span { position: relative; font-size: 84px; }

    .badges.dark span { background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink); box-shadow: none; }
    .final img.tall { width: auto; max-height: 430px; align-self: center; }
    .fmts { display: flex; justify-content: center; gap: 6px; }
    .fmts button { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 999px; padding: 5px 12px; font-size: 12px; position: relative; z-index: 6; }
    .fmts button[aria-pressed="true"] { background: #fff; color: #0a0f15; }
    .locked { text-align: center; align-items: center; }

    .start { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 40px 28px; background: transparent; color: var(--ink); }
    .start .go { margin-top: 18px; font-size: 16px; font-weight: 800; padding: 14px 18px; border-radius: 999px; border: 0; background: var(--ink); color: var(--c1); }
    .start .quiet { border: 0; background: none; color: var(--ink); text-decoration: underline; opacity: .8; }
    @media (prefers-reduced-motion: reduce) {
      .shapes i, .shapes b, .aura::before, .year-digits span, .top5 .row, .cap-reveal, .months i, .seasons4 > div, .journey .to { animation: none; }
    }

    .hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(255,255,255,.4); }
    .empty-state { text-align: center; align-items: center; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="story" id="story">
      <div class="bars" id="bars"></div>
      <div class="head"><span>SEDEAM WRAPPED</span><span><button id="music" aria-label="Poner música" hidden>🔇</button> <button id="pause" aria-label="Pausar">❚❚</button> <button id="close" aria-label="Cerrar">✕</button></span></div>
      <div class="shapes" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
      <div id="slides"></div>
      <div class="start" id="start" hidden>
        <div class="k">Sedeam Wrapped</div>
        <div class="year-digits" id="start-year"></div>
        <div class="big">Tu año en la sede</div>
        <div class="soft">Doce meses de plazos, caídas y Cl@ve, en un par de minutos.</div>
        <button class="go" id="start-music">▶ Empezar con música</button>
        <button class="quiet" id="start-quiet">Empezar sin sonido</button>
      </div>
      <div class="tap l" id="tap-prev" aria-hidden="true"></div>
      <div class="tap r" id="tap-next" aria-hidden="true"></div>
    </div>
  </div>
  <div class="hint">← → para moverte · espacio para pausar</div>
  <script type="module" src="wrapped.js"></script>
</body>
</html>
